<!doctype html><html lang="ja"><head>  <meta charset="UTF-8" />  <meta name="viewport" content="width=device-width, initial-scale=1.0" />  <title>買い物リスト</title>  <style>    :root { color-scheme: light; --green: #28734a; --cream: #fffaf1; --ink: #25342b; --line: #dbe6dc; }    * { box-sizing: border-box; }    body { margin: 0; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; background: linear-gradient(135deg, #e7f3e8, #fff7e9); color: var(--ink); }    main { width: min(680px, calc(100% - 32px)); margin: 48px auto; padding: 32px; background: rgba(255,255,255,.92); border-radius: 24px; box-shadow: 0 16px 45px rgba(45, 78, 54, .14); }    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.25rem); }    .subtitle { margin: 8px 0 28px; color: #66766b; }    form { display: grid; grid-template-columns: 1fr 120px auto; gap: 10px; }    input, textarea, select { min-width: 0; padding: 13px 14px; font: inherit; border: 2px solid var(--line); border-radius: 12px; outline: none; background: white; }    input:focus, textarea:focus, select:focus { border-color: var(--green); }    button { border: 0; border-radius: 12px; padding: 12px 17px; font: inherit; font-weight: 700; cursor: pointer; }    .add { background: var(--green); color: white; }    .add:hover { background: #1e5d3a; }    .controls { display: flex; align-items: center; justify-content: space-between; margin: 28px 0 12px; }    .count { font-size: .92rem; color: #66766b; }    .actions { display: flex; gap: 4px; }    .complete { padding: 7px 10px; background: transparent; color: #28734a; }    .reset { padding: 7px 10px; background: transparent; color: #396a4b; }    .clear { padding: 7px 10px; background: transparent; color: #a04141; }    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }    li { display: flex; align-items: center; gap: 12px; padding: 15px 4px; border-bottom: 1px solid var(--line); }    li label { flex: 1; cursor: pointer; font-size: 1.06rem; }    .quantity { color: #66766b; font-size: .94rem; white-space: nowrap; }    li.done label { color: #87958b; text-decoration: line-through; }    input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--green); }    .delete { background: #fbeaea; color: #a04141; padding: 7px 10px; }    .empty { padding: 28px 0; color: #66766b; text-align: center; }    .tip { margin: 24px 0 0; font-size: .86rem; color: #66766b; }    .templates { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line); }    .templates h2 { margin: 0 0 6px; font-size: 1.15rem; }
